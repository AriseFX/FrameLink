[package]
name = "framelink"
version = "3.1.2-dev"
edition = "2024"
rust-version = "1.88"
build = "rust/build.rs"
description = "FrameLink: low-latency screen streaming for remote analysis"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "FrameLink"
path = "rust/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
raw-window-handle = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.21.3", default-features = false }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Performance",
  "Win32_System_SystemInformation", "Win32_System_Com", "Win32_Media_Multimedia",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Security", "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
